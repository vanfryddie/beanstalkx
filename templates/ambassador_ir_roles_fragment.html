<div class="panel">
  <h2 class="panel-title" style="margin-bottom:2px;">{{ ambassador.full_name or ambassador.login }}</h2>
  <p style="font-size:12px; color:var(--text-lo); margin:4px 0 14px;">Pick which Indirect Roles this ambassador is set up to train.</p>
  <form method="POST" action="{{ url_for('ambassador_set_indirect_roles', ambassador_id=ambassador.id) }}" class="js-amb-ir-roles-form" data-ambassador-id="{{ ambassador.id }}">
    {% for section, rows in sections.items() %}
    <h3 style="font-size:12.5px; text-transform:uppercase; color:var(--text-lo); margin:16px 0 8px;">{{ section }}</h3>
    <div style="display:flex; flex-direction:column; gap:6px;">
      {% for row in rows %}
      <label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:13.5px;">
        <input type="checkbox" name="ir_role_config_id" value="{{ row.id }}" {{ 'checked' if row.id in assigned_ids }}>
        {{ row.role }}
      </label>
      {% endfor %}
    </div>
    {% endfor %}
    <div style="margin-top:18px; display:flex; align-items:center; gap:10px;">
      <button class="btn btn-gold btn-sm" type="submit">Save</button>
      <span class="js-amb-ir-roles-status" style="font-size:12.5px; color:var(--text-lo);"></span>
    </div>
  </form>
</div>
