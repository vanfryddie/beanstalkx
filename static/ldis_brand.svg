<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-labelledby="title desc">
  <title id="title">LDIS</title>
  <desc id="desc">Learning and Development Intelligence Systems logo with a light bulb, growth bars, and orange smile arrow.</desc>
  <defs>
    <linearGradient id="bar-blue" x1="0" y1="1" x2="0.88" y2="0"><stop offset="0" stop-color="#007AFF"/><stop offset="0.58" stop-color="#0A84FF"/><stop offset="1" stop-color="#5856D6"/></linearGradient>
    <linearGradient id="bulb-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="0.5" stop-color="#0A84FF"/><stop offset="1" stop-color="#5856D6"/></linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D1D1F"/><stop offset="1" stop-color="#3A3A3C"/></linearGradient>
    <filter id="tile-shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <style>
