    <path d="M55 25.5c-15.2 0-27.5 11.8-27.5 26.4 0 9.6 5.2 16.8 11.9 22.4 3.7 3 5.4 6.3 5.8 10.2h19.6c.4-3.9 2.1-7.2 5.8-10.2 6.7-5.6 11.9-12.8 11.9-22.4C82.5 37.3 70.2 25.5 55 25.5Z" fill="none" stroke="url(#bulb-blue)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38.5" y="55" width="7" height="14.5" rx="3.5" fill="#64D2FF"/><rect x="51.5" y="47" width="7" height="22.5" rx="3.5" fill="#0A84FF"/><rect x="64.5" y="39" width="7" height="30.5" rx="3.5" fill="url(#bar-blue)"/>
    <path d="M45.5 84.5h19M48.5 89h13" fill="none" stroke="#A1A1A6" stroke-width="2.4" stroke-linecap="round"/>
