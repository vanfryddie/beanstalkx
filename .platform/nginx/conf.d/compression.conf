# Compress what the console ships. The stylesheet alone is a quarter of
# a megabyte and the pages are tens of kilobytes of markup; over a site
# network that is most of what "the page is slow" means, and none of it
# was compressed, because nginx's own default gzip_types is text/html
# and nothing else.
#
# (Amazon Linux 2023 platform: files here are included inside the
# platform's own http block automatically — see appconfig.conf for why
# this is a .platform file and not an .ebextensions one.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
