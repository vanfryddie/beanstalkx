# Raise the upload size limit for CSV imports on the Data page.
# (Amazon Linux 2023 platform: files here are picked up automatically as
# part of the platform's own nginx setup — no container_commands/reload
# needed, unlike the older .ebextensions "files:" + container_commands
# pattern, which can run before the platform's own nginx config is in
# place and get silently overridden.)
client_max_body_size 50M;
